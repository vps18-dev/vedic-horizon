name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Vedic Horizon Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          echo "=== Searching for generated APKs ==="
          find . -name "*.apk" -print -exec cp -v {} ../dist/ \;
          echo "=== Content of dist directory ==="
          ls -la ../dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VedicHorizon-v1.0-Debug-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
